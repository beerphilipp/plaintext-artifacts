[project]
name = "danalyzer"
version = "0.1.1"
description = "Dynamic runner"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aaem",
    "androguard==4.1.3",
    "loguru",
    "lxml",
    "tqdm",
    "psutil",
    "uiautomator2",
    "ui_tars",
    "jsonschema",
    "openai"
]

[tool.setuptools]
packages = { find = { where = ["."], include = ["danalyzer*"] } }

[tool.setuptools.package-data]
"danalyzer.fastbot" = ["fastbot_libs/**/*"]
"danalyzer.raw_fastbot" = ["fastbot_libs/**/*"]

[project.scripts] 
danalyzer = "danalyzer.cli:cli" 
