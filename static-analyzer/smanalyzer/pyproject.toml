[project]
name = "smanalyzer"
version = "0.0.1"
description = "Static Manifest Analyzer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "androguard==4.1.3",
    "loguru",
    "lxml",
    "tqdm"
]

[tool.setuptools]
packages = { find = { where = ["."], include = ["smanalyzer*"] } }

[tool.setuptools.package-data]
"smanalyzer" = ["libs/**/*"]

[project.scripts] 
smanalyzer = "smanalyzer.cli:cli" 
